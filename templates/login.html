<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Cooperador</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">

<div class="login-box">
    <div class="login-logo">
        <div class="icone" aria-hidden="true">✝</div>
        <p class="nome-igreja">Christian Congregation in Japan</p>
        <p>クリスチャン・コングリゲーション・イン・ジャパン</p>
    </div>

    <h1>Área do Cooperador</h1>
    <p>Acesso restrito</p>

    {% if erro %}
    <div class="erro" role="alert">{{ erro }}</div>
    {% endif %}

    <form method="POST">
        <label for="senha">Senha de acesso</label>
        <input
            id="senha"
            type="password"
            name="senha"
            placeholder="Digite a senha"
            autocomplete="current-password"
            autofocus
            required
        >

        <button type="submit">Entrar</button>
    </form>

    <a href="{{ url_for('index') }}">← Voltar para página inicial</a>
</div>

</body>
</html>
